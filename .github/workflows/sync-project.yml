name: Sync project

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-project
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # The default token cannot read other repositories or write the organization project.
      - name: Create project token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-issues: write
          # Without it, a member whose membership is private looks like an outsider and is skipped.
          permission-members: read
          permission-pull-requests: write
          permission-organization-projects: write
      - name: Sync the project and the stage labels
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: node scripts/sync-project.mjs
